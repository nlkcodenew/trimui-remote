name: ui
on:
  push:
    paths: [".github/workflows/ui.yml", "ui/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + SDL2 arm64
        run: |
          set -e
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make file gcc-aarch64-linux-gnu libc6-dev-arm64-cross binutils-aarch64-linux-gnu libsdl2-dev:arm64 libsdl2-ttf-dev:arm64
      - name: Build remote-ui
        run: |
          set -e
          cd ui
          aarch64-linux-gnu-gcc -Os -o remote-ui remote-ui.c -I/usr/include -L/usr/lib/aarch64-linux-gnu -lSDL2 -lSDL2_ttf
          aarch64-linux-gnu-strip remote-ui
          file remote-ui
          readelf -d remote-ui | grep NEEDED
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp remote-ui "$GITHUB_WORKSPACE/out/"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-ui-aarch64
          path: out/
