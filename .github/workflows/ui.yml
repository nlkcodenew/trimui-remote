name: ui
on:
  push:
    paths: [".github/workflows/ui.yml", "ui/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Build remote-ui + dispctl (container arm64)
        run: |
          set -e
          docker run --platform linux/arm64 --rm -v "$PWD:/w" ubuntu:18.04 bash -c "
            set -e
            apt-get update
            apt-get install -y --no-install-recommends gcc make file binutils libsdl2-dev libsdl2-ttf-dev
            cd /w/ui
            gcc -Os -o remote-ui remote-ui.c -lSDL2 -lSDL2_ttf -lm
            gcc -Os -o dispctl dispctl.c
            strip remote-ui dispctl
            file remote-ui dispctl
            readelf -d remote-ui | grep NEEDED
            readelf -d dispctl | grep NEEDED
          "
          mkdir -p out
          cp ui/remote-ui ui/dispctl out/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-ui-aarch64
          path: out/
